name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recruitment
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recruitment?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/recruitment?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recruitment_shadow?schema=public
      APP_BASE_URL: http://localhost:3000
      EMAIL_PROVIDER: console
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: .data/uploads
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check schema and migrations agree
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE recruitment_shadow;"
          npm run db:check-drift

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Load draft content (pages are pre-rendered from the database at build time)
        run: npm run db:seed
        env:
          SEED_SAMPLE_CONTENT: "true"

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
